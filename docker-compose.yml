# =============================================================================
# docker-compose.yml
# =============================================================================
# 这个文件把“怎么构建镜像、映射端口、保存数据库”写成一份清单。
# 你只要在项目根目录执行：
#   docker compose up --build -d
# 就会按下面的配置启动，不必手打很长的 docker run。
#
# 新手只需改两处：
#   ports 左边的 8001  —— 电脑浏览器访问的端口
#   数据库挂载         —— 让新闻/产品数据在容器删除后还在
# =============================================================================

services:
  rxweb:
    # 用当前目录的 Dockerfile 构建镜像，打上名字方便认
    build: .
    image: rxweb:latest
    container_name: rxweb

    # 宿主机端口:容器端口
    # 浏览器访问 http://127.0.0.1:8001 会转到容器内部的 8001
    ports:
      - "8001:8001"

    # 数据库放到数据卷目录 /data ，不要把卷直接挂到 company.db 文件上
    # （Docker 命名卷只能挂目录，挂到文件路径会变成文件夹，SQLite 会报错）
    environment:
      RXWEB_DB: /data/company.db
    volumes:
      - rxweb-data:/data

    restart: unless-stopped

volumes:
  rxweb-data:
